name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run simulation smoke test
        run: python -c "import sys; sys.path.insert(0, 'src'); from parameters import ModelParameters; from simulation import run_simulation; res = run_simulation(ModelParameters(N=500, T=50, seed=42)); print('Peak:', res.infected_counts.max())"
